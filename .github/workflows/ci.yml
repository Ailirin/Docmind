name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Отмена устаревших прогонов того же PR/ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Используется везде: unit-тесты моки БД не трогают,
  # интеграционные — переопределяют через testcontainers
  DATABASE_URL: "postgresql+asyncpg://docmind:docmind@localhost:5432/docmind"
  LOG_LEVEL: "WARNING"
  LOG_FORMAT: "text"

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.12.5

      - name: Check imports & style
        run: ruff check app/ tests/

      - name: Check formatting
        run: ruff format --check app/ tests/

  # ── 2. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false   # Codecov опционален
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── 3. Integration tests ───────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test
    # Запускаем только при пуше в основную ветку (не на каждый PR)
    # чтобы не тратить Docker-минуты на каждый коммит
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests (testcontainers)
        run: pytest -m integration --no-cov -v
        # testcontainers сам стартует postgres:16-alpine внутри Docker,
        # который доступен в ubuntu-latest по умолчанию.
