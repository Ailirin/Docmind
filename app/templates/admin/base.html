<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}DocMind Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
    }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #e8eef2 0%, #f7f3ea 100%);
      color: var(--text);
    }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
    }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.75rem; }
    .muted { color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
    }
    th, td {
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .status {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
    }
    pre.block {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
      border: 1px solid var(--line);
      padding: 1rem;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <a href="/admin/documents">DocMind Admin</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
