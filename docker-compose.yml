services:
  db:
    image: postgres:16-alpine
    container_name: docmind-db
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    ports:
      - "5432:5432"
    volumes:
      - docmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 10


  ollama:
    image: ollama/ollama:latest
    container_name: docmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - docmind_ollama:/root/.ollama
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: docmind-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: docmind
      RABBITMQ_DEFAULT_PASS: docmind
    volumes:
      - docmind_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  api:
    build: .
    container_name: docmind-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DocMind
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql+psycopg2://docmind:docmind@db:5432/docmind
      RABBITMQ_URL: amqp://docmind:docmind@rabbitmq:5672/
      RABBITMQ_QUEUE: documents.process
      EXTRACTOR_PROVIDER: mock
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: llama3.2:1b
      LLM_API_KEY: ollama
    volumes:
      - docmind_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build: .
    ports:
      - "8001:8001"
    container_name: docmind-worker
    environment:
      APP_NAME: DocMind
      APP_VERSION: 0.1.0
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql+psycopg2://docmind:docmind@db:5432/docmind
      RABBITMQ_URL: amqp://docmind:docmind@rabbitmq:5672/
      RABBITMQ_QUEUE: documents.process
      EXTRACTOR_PROVIDER: mock
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: llama3.2:1b
      LLM_API_KEY: ollama
    volumes:
      - docmind_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: docmind-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - docmind_prometheus:/prometheus
    depends_on:
      - api
      - worker
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: docmind-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - docmind_grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: docmind-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - docmind_loki:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: docmind-promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped


volumes:
  docmind_pgdata:
  docmind_ollama:
  docmind_rabbitmq:
  docmind_uploads:
  docmind_prometheus:
  docmind_grafana:
  docmind_loki:
