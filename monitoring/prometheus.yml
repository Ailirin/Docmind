global:
  scrape_interval: 15s

scrape_configs:
  - job_name: docmind-api
    metrics_path: /metrics/
    basic_auth:
      username: metrics
      # Файл создаётся при старте контейнера из METRICS_PASSWORD (см. docker-compose.yml)
      password_file: /tmp/metrics_password
    static_configs:
      - targets: ["api:8000"]

  - job_name: docmind-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]

  # Глубина очереди и DLQ по каждой очереди (плагин rabbitmq_prometheus, порт 15692
  # доступен только внутри docker-сети). Серии: rabbitmq_detailed_queue_*{queue="..."}.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]
