[pytest]
pythonpath = .
testpaths = tests
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    -m "not integration"

asyncio_mode = auto

markers =
    integration: тесты с реальными внешними зависимостями (PostgreSQL через Docker).
                 Запускать явно: pytest -m integration
